[package]
name = "web_tools_commun"
version = "0.1.0"
edition = "2021"
description = "Commun aux web tools : serveur HTTP/HTTPS, appairage, canal de pilotage"

[dependencies]
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
socket2 = "0.5"
gethostname = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
