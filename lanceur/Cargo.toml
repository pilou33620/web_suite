[package]
name = "web_suite_lanceur"
version = "0.1.0"
edition = "2021"
description = "WEB·SUITE : lanceur des outils, installateur, serveur MCP"

[lib]
path = "src/lib.rs"
doctest = false # les schémas indentés des en-têtes de module ne sont pas du code

# Les exécutables sont les fichiers de src/bin/ (web_suite, mcp_web_suite, installer…).

[dependencies]
web_tools_commun = { path = "../commun" }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# le client HTTPS de tests/banc_serveur.rs (les mêmes versions que commun)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# la fausse Python du banc est l'exécutable du test lui-même : pas de harnais
[[test]]
name = "banc_dependances"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }
