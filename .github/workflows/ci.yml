name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python ne sert plus qu'aux faux outils du banc de web_bench (web_bench lance les outils et
      # leurs bancs avec Python) et aux comparaisons en ligne des copies des outils, plus bas.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exécutables Rust (lanceur, MCP, web_bench)
        run: cargo build --workspace --bins

      # Avant les tests : banc_savoir relit les anciennes consignes que le relevé cite, et
      # banc_traces_ia les fichiers suivis des outils, dans ces clones.
      - name: Outils — clones de WEB_CAO, WEB_ANTENNA et WEB_3D à côté du dépôt
        run: |
          for o in WEB_CAO WEB_ANTENNA WEB_3D; do
            git clone --quiet --depth 1 https://github.com/pilou33620/$o.git ../$o
          done

      # Tests unitaires, et les bancs (lanceur/tests/, web_bench/tests/), qui pilotent les
      # exécutables en boîte noire : serveur du lanceur (Host, jeton du mode réseau, X-WebSuite),
      # dépendances (pip seulement s'il manque un paquet), serveur MCP (protocole, outils, refus),
      # skill web-suite et relevé des consignes, retrait de l'ancien assistant IA, web_bench
      # (relais, sonde, routes arrêtées, bancs, rapports, avec de faux outils).
      - name: Tests Rust — commun, ipc2581, lanceur, web_bench, et leurs bancs
        run: cargo test --workspace

      # Node 20 comme sur le Pi : BroadcastChannel et crypto y sont globaux, le banc s'en sert
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Canal de pilotage — page (pilote.js : relais, cartes, interrupteur)"
        run: node lanceur/banc_pilote.js

      - name: Banc d'essai web_bench — syntaxe de la page
        run: node --check web_bench/page/banc.js && node --check web_bench/page/sonde.js

      # La mise à jour au démarrage est recopiée dans chaque outil, qui doit
      # tourner seul, sans le lanceur : on ne peut pas la partager. On vérifie
      # donc que les trois copies restent la même.
      - name: Outils — la mise à jour automatique est la même partout
        run: |
          python - <<'EOF'
          import ast, os
          def corps(f):
              src = open(f, encoding="utf-8").read()
              for n in ast.walk(ast.parse(src)):
                  if isinstance(n, ast.FunctionDef) and n.name == "verifier_et_appliquer_maj":
                      texte = ast.get_source_segment(src, n)
                      for nom in ("WEB_CAO", "WEB_ANTENNA", "WEB_3D", "RACINE", "ROOT"):
                          texte = texte.replace(nom, "X")
                      return [l.split("#")[0].rstrip() for l in texte.splitlines()]
          ref = corps("../WEB_CAO/web_CAO.py")
          for f in ("../WEB_ANTENNA/web_antenna.py", "../WEB_3D/web_3D.py"):
              if not os.path.exists(f):      # outil porté en Rust : plus de copie Python à comparer
                  continue
              assert corps(f) == ref, f + " : verifier_et_appliquer_maj diverge de WEB_CAO"
          print("les copies Python restantes sont identiques")
          EOF

      # L'appairage (code à 6 chiffres, jeton et cookie partagés) est recopié
      # dans chaque outil, qui doit tourner seul : les copies restent la même.
      - name: Outils — appairage.py est le même partout
        run: |
          for o in WEB_ANTENNA WEB_3D; do
            [ -f ../$o/appairage.py ] || continue   # outil porté en Rust : il prend commun/
            diff <(tr -d '\r' < ../WEB_CAO/appairage.py) <(tr -d '\r' < ../$o/appairage.py) > /dev/null \
              || { echo "appairage.py diffère entre WEB_CAO et $o"; exit 1; }
          done
          echo "appairage.py identique"

      # Le canal de pilotage du MCP est recopié dans chaque outil, qui doit tourner seul :
      # même règle que appairage.py, l'original est dans lanceur/
      - name: Outils — pilote.py, pilote.js et pilote.css sont les mêmes partout
        run: |
          verifier() {
            diff <(tr -d '\r' < "$1") <(tr -d '\r' < "../$2") > /dev/null \
              || { echo "$1 diffère de $2"; exit 1; }
          }
          verifier lanceur/pilote.js WEB_CAO/commun/pilote.js
          verifier lanceur/pilote.css WEB_CAO/commun/pilote.css
          for o in WEB_ANTENNA WEB_3D; do
            [ ! -f ../$o/pilote.py ] || verifier ../WEB_CAO/pilote.py $o/pilote.py
            verifier lanceur/pilote.js $o/js/pilote.js
            verifier lanceur/pilote.css $o/css/pilote.css
          done
          echo "canal de pilotage identique dans les trois outils"

      # L'aide des commandes de la page (Pilote.aide) est tirée des définitions du MCP : banc_mcp.rs
      # ne la voit pas ici (WEB_CAO n'est pas dans le dépôt), elle se vérifie sur le clone.
      - name: Outils — WEB_CAO/commun/pilote-aide.json suit les définitions du MCP
        run: |
          target/debug/aide_pilote --stdout | cmp - ../WEB_CAO/commun/pilote-aide.json \
            || { echo "pilote-aide.json périmé : bin/aide_pilote, puis pousser WEB_CAO d'abord"; exit 1; }
          echo "pilote-aide.json à jour"

      # Même raison pour le lecteur IPC-2581 : WEB_CAO et WEB_ANTENNA en ont
      # chacun une copie, qui avait divergé (chacune avait une correction que
      # l'autre n'avait pas). Une correction se fait désormais des deux côtés.
      - name: Outils — le lecteur IPC-2581 est le même dans WEB_CAO et WEB_ANTENNA
        run: |
          for f in ipc2581_data.py ipc2581_parser.py ipc2581_json.py; do
            diff <(tr -d '\r' < ../WEB_CAO/python/$f) <(tr -d '\r' < ../WEB_ANTENNA/python/$f) > /dev/null \
              || { echo "python/$f diffère entre WEB_CAO et WEB_ANTENNA"; exit 1; }
          done
          echo "lecteur IPC-2581 identique dans les deux outils"
